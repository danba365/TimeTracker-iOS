# Builds the app on every push and pull request so a broken build is
# caught on GitHub, not later on the device. No signing / Apple account needed.
name: Build

on:
  push:
  pull_request:
    branches: [main]

# Cancel an older run on the same branch when a newer push arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('TimeTrackerVoice.xcodeproj/project.pbxproj') }}

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project TimeTrackerVoice.xcodeproj \
            -scheme TimeTrackerVoice \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
